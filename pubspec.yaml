name: bandbuddy_app
description: 米环资源大全 - 聚合米坛社区(BandBBS)等来源的小米手环第三方资源
publish_to: 'none'
# 版本格式：<versionName>+<versionCode>
# versionName 须与 lib/core/config.dart 的 AppConfig.appVersion、GitHub Releases tag 一致；
# versionCode 每次发版必须递增（Android 按它判断新旧，不变会导致无法覆盖安装）
version: 1.1.6+16

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  html: ^0.15.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.14.1
  flutter_file_dialog: ^3.3.2
  open_filex: ^4.7.0
  permission_handler: ^13.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
